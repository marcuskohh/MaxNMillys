<!-- ===================== SIGN UP FORM ===================== -->
<main>
    <section class="form-container">
      <header class="form-header">
        <h1>Sign Up Form</h1>
      </header>

    <form action="thankyou signup.html">

        <!-- First name field -->
        <label for="firstname">First Name:</label>
        <input type="text" id="firstname" placeholder="Enter your first name" required>

        <!-- Last name field -->
        <label for="lastname">Last Name:</label>
        <input type="text" id="lastname" placeholder="Enter your last name" required>

        <!-- Email field - type="email" makes it so that its required to have "@" before submitting -->
        <label for="email">Email Address:</label>
        <input type="email" id="email" placeholder="example@gmail.com" required>

        <!-- Contact number field -->
        <label for="contact">Contact Number:</label>
        <input type="text" id="username" placeholder="e.g.82927743" required>

        <!-- Password fields - type="password" makes it so that when its typed in, its replaces with small black balls to cover the password-->
        <label for="password">Password:</label>
        <input type="password" id="password" placeholder="Enter Password" required>

        <label for="confirm">Confirm Password:</label>
        <input type="password" id="confirm" placeholder="Confirm password" required>

        <!-- Submit button -->
        <button type="submit">Create Account</button>

    </form>
</section>
</main>
